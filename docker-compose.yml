version: '3.8'

services:
  redis:
    image: redis:latest
    container_name: blog-redis
    restart: always
    volumes:
      - redis-data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog-backend
    restart: always
    depends_on:
      - redis
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/app/blog.db
      - RedisSettings__ConnectionString=redis:6379
    volumes:
      - blog-data:/app
    networks:
      - blog-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blog-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - blog-network

volumes:
  redis-data:
  blog-data:

networks:
  blog-network:
    driver: bridge